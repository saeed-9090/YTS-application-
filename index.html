<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dosti Cafe — Premium Digital Menu</title>

<!-- 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  GOOGLE FONTS                                                    ║
  ║                                                                  ║
  ║  Playfair Display → Elegant headings (restaurant name)           ║
  ║  Poppins          → Clean body text                              ║
  ║  Bebas Neue       → Bold category titles                         ║
  ║                                                                  ║
  ║  🔄 TO CUSTOMIZE: Replace font names with your choice            ║
  ╚══════════════════════════════════════════════════════════════════╝
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  CSS VARIABLES — Easy customization from one place               ║
  ║                                                                  ║
  ║  🔄 TO CUSTOMIZE THE WHOLE THEME:                                ║
  ║  - Change --accent for main yellow color                         ║
  ║  - Change --bg-dark for background                               ║
  ║  - Change --text-main for text color                             ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
:root {
  --bg-dark:       #0a0a0a;          /* Deep black background */
  --bg-card:       #141414;          /* Card slight lighter */
  --bg-card-2:     #1a1a1a;          /* Alternate cards */
  --accent:        #FFC72C;          /* Signature golden yellow */
  --accent-soft:   #FFD966;          /* Lighter yellow */
  --accent-glow:   rgba(255,199,44,0.25);
  --text-main:     #FFFFFF;          /* Main white text */
  --text-soft:     #b8b8b8;          /* Soft grey text */
  --text-muted:    #777777;          /* Descriptions */
  --divider:       #2a2a2a;          /* Border lines */
  --success:       #25D366;          /* WhatsApp green */
  --danger:        #ff4d4d;          /* Remove buttons */
  --shadow-card:   0 8px 30px rgba(0,0,0,0.5);
  --shadow-glow:   0 0 40px var(--accent-glow);
  --radius-lg:     20px;
  --radius-md:     14px;
  --radius-sm:     8px;
  --transition:    all 0.3s ease;
}

/* ━━━━━━━━━━━━━━━━━━ RESET & BASE ━━━━━━━━━━━━━━━━━━ */
* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-dark);
  color: var(--text-main);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
  /* Dynamic background — changes per category via JS */
  transition: background 1.2s ease;
}

/* Custom scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  BACKGROUND GLOW LAYER                                           ║
  ║                                                                  ║
  ║  Soft radial glow that changes color per visible category        ║
  ║  Performance friendly — no backdrop-filter used                  ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
.bg-glow {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(circle at 50% 30%, var(--accent-glow), transparent 60%);
  opacity: 0.4;
  transition: background 1.2s ease, opacity 1.2s ease;
}

/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  CART ICON (Top Right Floating)                                  ║
  ║                                                                  ║
  ║  Golden bag icon with item count badge                           ║
  ║  Pulse animation on add                                          ║
  ║                                                                  ║
  ║  🔄 TO CUSTOMIZE:                                                ║
  ║  - Change position: top/right values                             ║
  ║  - Change colors: background gradient                            ║
  ║  - Change icon: replace SVG below                                ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
#cart-icon {
  position: fixed;
  top: 20px; right: 20px;
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--accent), #e0a818);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 999;
  box-shadow: 0 6px 20px rgba(255,199,44,0.4);
  transition: var(--transition);
  border: 2px solid rgba(255,255,255,0.15);
}
#cart-icon:hover { transform: scale(1.1) rotate(-5deg); }
#cart-icon svg { width: 26px; height: 26px; color: #0a0a0a; }

#cart-badge {
  position: absolute;
  top: -4px; right: -4px;
  min-width: 22px; height: 22px;
  background: #ff3b3b;
  color: white;
  font-size: 12px; font-weight: 700;
  border-radius: 50%;
  display: none;
  align-items: center; justify-content: center;
  padding: 0 6px;
  border: 2px solid var(--bg-dark);
}
#cart-badge.show { display: flex; }

@keyframes cartPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.25); box-shadow: 0 0 30px var(--accent); }
}
#cart-icon.pulse { animation: cartPulse 0.5s ease; }

/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  HERO SECTION                                                    ║
  ║                                                                  ║
  ║  Big top banner with restaurant name, tagline, hero image        ║
  ║  Matches design reference — yellow "Special" text                ║
  ║                                                                  ║
  ║  🔄 TO CUSTOMIZE:                                                ║
  ║  - Change restaurant name in HTML                                ║
  ║  - Change hero image URL                                         ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
.hero {
  position: relative;
  min-height: 90vh;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center;
  padding: 60px 20px 40px;
  background: 
    linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(10,10,10,0.95) 100%),
    url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1600&q=80') center/cover;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: 20px; left: 20px;
  width: 60px; height: 60px;
  background: var(--accent);
  border-radius: 50%;
  opacity: 0.15;
  filter: blur(20px);
}
.hero-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 4px;
  color: var(--accent);
  margin-bottom: 8px;
}
.hero-title {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: clamp(2.5rem, 8vw, 5.5rem);
  line-height: 1;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.hero-title .yellow {
  color: var(--accent);
  font-style: italic;
  display: block;
  text-shadow: 0 4px 20px var(--accent-glow);
}
.hero-tagline {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: clamp(1rem, 3vw, 1.5rem);
  color: var(--text-soft);
  margin-bottom: 30px;
}
.hero-info {
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid var(--divider);
  font-size: 14px;
  color: var(--text-soft);
}
.hero-info .phone {
  color: var(--accent);
  font-weight: 600;
  font-size: 16px;
  margin-top: 5px;
}

/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  CATEGORY SECTION                                                ║
  ║                                                                  ║
  ║  Each category has heading + grid of items                       ║
  ║  Item layout: NUMBER | TEXT INFO | CIRCULAR IMAGE                ║
  ║                                                                  ║
  ║  🔄 TO CUSTOMIZE: Change padding/spacing here                    ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
.menu-container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; }
.category {
  margin-bottom: 80px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.category.visible { opacity: 1; transform: translateY(0); }

.category-header { text-align: center; margin-bottom: 40px; }
.category-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2rem, 5vw, 3rem);
  letter-spacing: 3px;
  color: var(--text-main);
  position: relative;
  display: inline-block;
  padding-bottom: 12px;
}
.category-title::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 60px; height: 3px;
  background: var(--accent);
  border-radius: 2px;
}
.category-subtitle {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  color: var(--text-muted);
  margin-top: 10px;
  font-size: 14px;
}

/* ━━━━━━━━━━━━━━━━━━ ITEMS GRID ━━━━━━━━━━━━━━━━━━ */
.items-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 30px;
}

/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  FOOD ITEM CARD                                                  ║
  ║                                                                  ║
  ║  Layout: Number + (Title, Description, Price) + Round Image      ║
  ║  Inspired by reference design                                    ║
  ║                                                                  ║
  ║  🔄 TO CUSTOMIZE:                                                ║
  ║  - Change card background in CSS variables                       ║
  ║  - Adjust image size: .item-image width/height                   ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
.item-card {
  background: var(--bg-card);
  border: 1px solid var(--divider);
  border-radius: var(--radius-md);
  padding: 20px;
  display: grid;
  grid-template-columns: 30px 1fr 100px;
  gap: 15px;
  align-items: center;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.item-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
  transform: scaleY(0);
  transform-origin: top;
  transition: transform 0.4s ease;
}
.item-card:hover {
  border-color: var(--accent);
  transform: translateY(-4px);
  box-shadow: 0 12px 30px rgba(255,199,44,0.15);
}
.item-card:hover::before { transform: scaleY(1); }

.item-number {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  color: var(--accent);
  text-align: center;
}

.item-info { min-width: 0; }
.item-name-row {
  display: flex; align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
}
.item-name {
  font-weight: 600;
  font-size: 16px;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-dots {
  flex: 1;
  border-bottom: 1px dotted var(--text-muted);
  height: 1px;
  margin-bottom: 4px;
}
.item-price {
  color: var(--accent);
  font-weight: 700;
  font-size: 15px;
  white-space: nowrap;
}
.item-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.4;
  margin-bottom: 10px;
}

.item-image {
  width: 90px; height: 90px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--accent);
  box-shadow: 0 4px 15px var(--accent-glow);
  flex-shrink: 0;
  background: var(--bg-card-2);
}
.item-image img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}
.item-card:hover .item-image img { transform: scale(1.15); }

/* ━━━━━━━━━━━━━━━━━━ ADD TO CART BUTTON ━━━━━━━━━━━━━━━━━━ */
.add-btn {
  grid-column: 1 / -1;
  margin-top: 10px;
  padding: 10px 16px;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
}
.add-btn:hover {
  background: var(--accent);
  color: #0a0a0a;
}
.add-btn svg { width: 16px; height: 16px; }

/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  ABOUT US SPECIAL CARDS                                          ║
  ║                                                                  ║
  ║  Different styling — Icon + Info, NO add-to-cart button          ║
  ║  Click → opens WhatsApp / Phone / Maps                           ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
.about-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px;
}
.about-card {
  background: linear-gradient(145deg, var(--bg-card), var(--bg-card-2));
  border: 1px solid var(--divider);
  border-radius: var(--radius-md);
  padding: 30px 20px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  color: var(--text-main);
  display: block;
}
.about-card:hover {
  border-color: var(--accent);
  transform: translateY(-6px);
  box-shadow: var(--shadow-glow);
}
.about-icon {
  width: 60px; height: 60px;
  margin: 0 auto 16px;
  background: var(--accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #0a0a0a;
}
.about-icon svg { width: 30px; height: 30px; }
.about-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--accent);
  margin-bottom: 8px;
}
.about-text { font-size: 14px; color: var(--text-soft); }

/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  CART MODAL                                                      ║
  ║                                                                  ║
  ║  Slides in from right — shows cart items, totals, form           ║
  ║  WhatsApp send button at bottom                                  ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  display: none;
  align-items: flex-end; justify-content: center;
  padding: 0;
}
.modal-overlay.show { display: flex; }

.cart-modal {
  background: var(--bg-dark);
  border-top: 3px solid var(--accent);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  width: 100%; max-width: 500px;
  max-height: 90vh;
  display: flex; flex-direction: column;
  animation: slideUp 0.4s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.cart-header {
  padding: 20px;
  border-bottom: 1px solid var(--divider);
  display: flex; align-items: center; justify-content: space-between;
}
.cart-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 2px;
  color: var(--accent);
}
.close-btn {
  background: transparent;
  border: none;
  color: var(--text-main);
  font-size: 28px;
  cursor: pointer;
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.close-btn:hover { background: var(--divider); }

.cart-body {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

.cart-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  padding: 14px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  align-items: center;
}
.cart-item-name { font-weight: 600; font-size: 14px; }
.cart-item-price { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
.cart-item-controls {
  display: flex; align-items: center; gap: 8px;
}
.qty-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  font-weight: 700;
  transition: var(--transition);
}
.qty-btn:hover { background: var(--accent); color: #0a0a0a; }
.qty-display { min-width: 24px; text-align: center; font-weight: 600; }
.remove-btn {
  background: transparent; border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 18px;
  margin-left: 6px;
}

.cart-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.cart-form { padding: 20px; border-top: 1px solid var(--divider); }
.form-group { margin-bottom: 12px; }
.form-group label {
  display: block;
  font-size: 12px;
  color: var(--text-soft);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.form-group input,
.form-group textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-card);
  border: 1px solid var(--divider);
  border-radius: var(--radius-sm);
  color: var(--text-main);
  font-family: inherit;
  font-size: 14px;
  transition: var(--transition);
}
.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.form-group textarea { resize: vertical; min-height: 60px; }

.cart-total {
  display: flex; justify-content: space-between;
  padding: 14px 0;
  font-size: 18px;
  font-weight: 700;
  border-top: 1px solid var(--divider);
  margin-top: 10px;
}
.cart-total span:last-child { color: var(--accent); }

.whatsapp-btn {
  width: 100%;
  padding: 14px;
  background: var(--success);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: var(--transition);
  margin-top: 10px;
}
.whatsapp-btn:hover { background: #1ebe5d; transform: translateY(-2px); }
.whatsapp-btn:disabled { background: #555; cursor: not-allowed; transform: none; }

/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  TOAST NOTIFICATION                                              ║
  ║                                                                  ║
  ║  Small popup at bottom — "Item added!" type messages             ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
.toast {
  position: fixed;
  bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--accent);
  color: #0a0a0a;
  padding: 12px 24px;
  border-radius: 30px;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 6px 20px var(--accent-glow);
  z-index: 1100;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  FOOTER                                                          ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
footer {
  background: #060606;
  border-top: 1px solid var(--divider);
  padding: 30px 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}
footer .accent { color: var(--accent); font-weight: 600; }

/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  RESPONSIVE DESIGN                                               ║
  ║                                                                  ║
  ║  Mobile-first breakpoints                                        ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
@media (max-width: 768px) {
  .item-card {
    grid-template-columns: 24px 1fr 70px;
    padding: 14px;
    gap: 10px;
  }
  .item-image { width: 70px; height: 70px; border-width: 2px; }
  .item-name { font-size: 14px; }
  .item-price { font-size: 13px; }
  .item-desc { font-size: 12px; }
  #cart-icon { width: 50px; height: 50px; top: 15px; right: 15px; }
  .menu-container { padding: 40px 15px; }
  .category { margin-bottom: 60px; }
}
@media (max-width: 480px) {
  .item-card { grid-template-columns: 20px 1fr 60px; gap: 8px; padding: 12px; }
  .item-image { width: 60px; height: 60px; }
  .item-number { font-size: 18px; }
  .hero { min-height: 70vh; padding: 40px 15px; }
}

/* Reduced motion accessibility */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- Background glow layer (dynamic color) -->
<div class="bg-glow" id="bgGlow"></div>

<!-- 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  CART ICON (Top Right)                                           ║
  ║  🔄 SVG icon — replace below if needed                           ║
  ╚══════════════════════════════════════════════════════════════════╝
-->

/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  RENDER MENU FUNCTION                                            ║
  ║                                                                  ║
  ║  Builds all category sections from menuData                      ║
  ║  Adds About Us cards at the end                                  ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
function renderMenu() {
  const container = document.getElementById('menuContainer');
  let html = '';

  menuData.forEach((cat, ci) => {
    html += `
      <section class="category" data-accent="${cat.accent}">
        <div class="category-header">
          <h2 class="category-title">${cat.name}</h2>
          <p class="category-subtitle">~ Limited Time Selection ~</p>
        </div>
        <div class="items-grid">
          ${cat.items.map((item, ii) => `
            <div class="item-card">
              <div class="item-number">${String(ii + 1).padStart(2, '0')}</div>
              <div class="item-info">
                <div class="item-name-row">
                  <span class="item-name">${item.name}</span>
                  <span class="item-dots"></span>
                  <span class="item-price">${RESTAURANT.currency} ${item.price}</span>
                </div>
                <p class="item-desc">${item.desc}</p>
              </div>
              <div class="item-image">
                <img src="${item.img}" alt="${item.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/200/1a1a1a/FFC72C?text=Food'">
              </div>
              <button class="add-btn" onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.price})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
                Add to Cart
              </button>
            </div>
          `).join('')}
        </div>
      </section>
    `;
  });

  // About Us section
  html += `
    <section class="category" data-accent="rgba(255,199,44,0.30)">
      <div class="category-header">
        <h2 class="category-title">Contact Us</h2>
        <p class="category-subtitle">~ We're Here to Help ~</p>
      </div>
      <div class="about-grid">
        ${aboutCards.map(c => `
          <a href="${c.link}" target="_blank" class="about-card">
            <div class="about-icon">${c.icon}</div>
            <div class="about-title">${c.title}</div>
            <div class="about-text">${c.text}</div>
          </a>
        `).join('')}
      </div>
    </section>
  `;

  container.innerHTML = html;
  observeCategories();
       }
  /* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  DYNAMIC BACKGROUND — Intersection Observer                      ║
  ║                                                                  ║
  ║  Detects visible category and changes background glow color      ║
  ║  Performance-friendly (no scroll listener)                       ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
function observeCategories() {
  const sections = document.querySelectorAll('.category');
  const glow = document.getElementById('bgGlow');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        const accent = entry.target.dataset.accent;
        if (accent) {
          glow.style.background = `radial-gradient(circle at 50% 30%, ${accent}, transparent 60%)`;
        }
      }
    });
  }, { threshold: 0.25 });

  sections.forEach(s => observer.observe(s));
}

/* 
  ╔══════════════════════════════════════════════════════════════════╗
  ║  CART SYSTEM                                                     ║
  ║                                                                  ║
  ║  - localStorage persistence                                      ║
  ║  - Add / Remove / Quantity change                                ║
  ║  - WhatsApp order send                                           ║
  ╚══════════════════════════════════════════════════════════════════╝
*/
let cart = JSON.parse(localStorage.getItem('dosti_cart') || '[]');

function saveCart() {
  localStorage.setItem('dosti_cart', JSON.stringify(cart));
  updateBadge();
}

function updateBadge() {
  const badge = document.getElementById('cart-badge');
  const count = cart.reduce((s, i) => s + i.qty, 0);
  badge.textContent = count;
  badge.classList.toggle('show', count > 0);
}

function addToCart(name, price) {
  const found = cart.find(i => i.name === name);
  if (found) found.qty++;
  else cart.push({ name, price, qty: 1 });
  saveCart();
  showToast(`✓ ${name} added!`);
  // Pulse cart icon
  const icon = document.getElementById('cart-icon');
  icon.classList.add('pulse');
  setTimeout(() => icon.classList.remove('pulse'), 500);
}

function changeQty(idx, delta) {
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  saveCart();
  renderCart();
}

function removeItem(idx) {
  cart.splice(idx, 1);
  saveCart();
  renderCart();
}

function renderCart() {
  const body = document.getElementById('cartBody');
  const form = document.getElementById('cartForm');
  if (cart.length === 0) {
    body.innerHTML = '<div class="cart-empty">🛒<br>Your cart is empty<br><small>Add some delicious items!</small></div>';
    form.style.display = 'none';
    return;
  }
  let html = '';
  let total = 0;
  cart.forEach((item, i) => {
    const sub = item.price * item.qty;
    total += sub;
    html += `
      <div class="cart-item">
        <div>
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-price">${RESTAURANT.currency} ${item.price} × ${item.qty} = ${RESTAURANT.currency} ${sub}</div>
        </div>
        <div class="cart-item-controls">
          <button class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
          <span class="qty-display">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
          <button class="remove-btn" onclick="removeItem(${i})" aria-label="Remove">✕</button>
        </div>
      </div>
    `;
  });
  body.innerHTML = html;
  form.style.display = 'block';
  document.getElementById('cartTotal').textContent = `${RESTAURANT.currency} ${total}`;
}

function openCart() {
  document.getElementById('cartModal').classList.add('show');
  renderCart();
  document.body.style.overflow = 'hidden';
}
  function closeCart() {
  document.getElementById('cartModal').classList.remove('show');
  document.body.style.overflow = '';
}

/* WhatsApp Order Send */
function sendWhatsApp() {
  const name = document.getElementById('custName').value.trim();
  const table = document.getElementById('tableNum').value.trim();
  const note = document.getElementById('specialInst').value.trim();

  if (!name) { showToast('⚠ Please enter your name'); return; }
  if (!table) { showToast('⚠ Please enter table number'); return; }
  if (cart.length === 0) { showToast('⚠ Cart is empty'); return; }

  let total = 0;
  const items = cart.map((i, idx) => {
    const sub = i.price * i.qty;
    total += sub;
    return `${idx + 1}. ${i.name} x ${i.qty} = ${RESTAURANT.currency} ${sub}`;
  }).join('\n');

  const now = new Date().toLocaleString();

  const msg = 
`🍽️ *NEW ORDER - ${RESTAURANT.name}*
👤 Customer: ${name}
🪑 Table: ${table}
⏰ Time: ${now}

📋 *ORDER ITEMS:*
${items}

💰 *TOTAL: ${RESTAURANT.currency} ${total}*
💵 Payment: Cash
📌 Note: ${note || 'None'}

_Sent via ${RESTAURANT.name} Digital Menu_`;

  const url = `https://wa.me/${RESTAURANT.whatsapp}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

/* Toast */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

/* Keyboard: ESC closes cart */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeCart();
});

/* INIT */
renderMenu();
updateBadge();
</script>
